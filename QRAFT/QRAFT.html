  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    S.logo.url=e.target.result;
    // Create 200px thumbnail for preset saving
    const img=new Image();
    img.onload=()=>{
      const maxSz=200, sc=Math.min(1,maxSz/Math.max(img.width,img.height));
      const tc=document.createElement('canvas');
      tc.width=Math.round(img.width*sc); tc.height=Math.round(img.height*sc);
      tc.getContext('2d').drawImage(img,0,0,tc.width,tc.height);

function getIcon(id) { return ICONS.find(ic => ic.id === id) || ICONS[0]; }

function initIcons() {
  const svgAttr = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"';
  document.getElementById('icon-g').innerHTML = ICONS.map((ic, i) =>
    `<button class="ib${i===0?' on':''}" onclick="pickIcon('${ic.id}',this)" title="${ic.label}"><svg ${svgAttr}><path d="${ic.path}"/></svg></button>`
  ).join('');
}
function pickIcon(id, btn) {
  document.querySelectorAll('.ib').forEach(b => b.classList.remove('on'));
  btn.classList.add('on'); S.ico.icon = id; go();
}

// ════════════════════════════════════════
//  DARK MODE
// ════════════════════════════════════════
function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('ic-moon').style.display = dark ? '' : 'none';
  document.getElementById('ic-sun').style.display  = dark ? 'none' : '';
  localStorage.setItem('qr-theme', dark ? 'light' : 'dark');
}

function applyTheme() {
  const saved = localStorage.getItem('qr-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  if (saved === 'dark') {
    document.getElementById('ic-moon').style.display = 'none';
    document.getElementById('ic-sun').style.display  = '';
  }
}

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════
function init() {
  initIcons();
  document.getElementById('ico-on').addEventListener('change',   ()=>{S.ico.on=document.getElementById('ico-on').checked;});
  document.getElementById('logo-on').addEventListener('change',  ()=>{S.logo.on=document.getElementById('logo-on').checked;});
  document.getElementById('ico-po').addEventListener('change',   ()=>{S.ico.pos=document.getElementById('ico-po').value;});
  document.getElementById('logo-po').addEventListener('change',  ()=>{S.logo.pos=document.getElementById('logo-po').value;});
  document.getElementById('ico-sz').addEventListener('input',    ()=>{S.ico.sz=parseInt(document.getElementById('ico-sz').value);});
  document.getElementById('logo-sz').addEventListener('input',   ()=>{S.logo.sz=parseInt(document.getElementById('logo-sz').value);});
  document.getElementById('logo-r').addEventListener('input',    ()=>{S.logo.r=parseInt(document.getElementById('logo-r').value);});
  document.getElementById('ico-bg').addEventListener('input',    ()=>{S.ico.bg=document.getElementById('ico-bg').value;});
  document.getElementById('ico-sw').addEventListener('input',    ()=>{S.ico.sw=parseInt(document.getElementById('ico-sw').value)||0;});
  document.getElementById('ico-sc').addEventListener('input',    ()=>{S.ico.sc=document.getElementById('ico-sc').value;});
  document.getElementById('ico-sct').addEventListener('input',   ()=>{S.ico.sc=document.getElementById('ico-sct').value;});
  document.getElementById('logo-sw').addEventListener('input',   ()=>{S.logo.sw=parseInt(document.getElementById('logo-sw').value)||0;});
  document.getElementById('logo-sc').addEventListener('input',   ()=>{S.logo.sc=document.getElementById('logo-sc').value;});
  document.getElementById('logo-sct').addEventListener('input',  ()=>{S.logo.sc=document.getElementById('logo-sct').value;});
  applyTheme();
  go();
  // Fallback: ensure canvas renders after all resources (CDN, fonts) are fully loaded
  window.addEventListener('load', () => {
    const c = document.getElementById('qc');
    if (!c || c.width === 0) go();
  });
}
init();
</script>
